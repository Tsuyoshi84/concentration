<div class="feedback" role="status" aria-live="polite" aria-atomic="true">
  @if (showsMessage()) {
    <p class="result" [class]="animateClasses()">
      @switch (displayResult()) {
        @case ('Correct') { A lovely little match! ✦ }
        @case ('Wrong') { Not quite. You've got this! }
        @case ('Finish') { Every card found its friend! ✨ }
      }
    </p>
  } @else { <p class="hint">Flip two cards. Find a little connection.</p> }
</div>
